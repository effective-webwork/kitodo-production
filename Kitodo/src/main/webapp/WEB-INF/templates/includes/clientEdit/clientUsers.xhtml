<ui:composition
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dataTable id="clientUserTable"
                 var="clientUser"
                 value="#{ClientEditView.clientUsers}">
        <p:column headerText="#{msgs.user}"
                  id="userName">
            <h:outputText value="#{clientUser.fullName}"/>
        </p:column>
    </p:dataTable>

</ui:composition>
